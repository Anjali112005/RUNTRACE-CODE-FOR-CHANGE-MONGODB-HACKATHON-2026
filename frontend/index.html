<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RunTrace — Find the Regression. Trace the Evidence. Verify the Fix." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <title>RunTrace</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash. Light is the default.
      try {
        if (localStorage.getItem('runtrace-theme') === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
